name = "HandshakeCore"
defaultTargets = ["linked-run"]
moreLeanArgs = ["-DautoImplicit=false"]

# The Cerberus-Lean evaluator, pinned by commit. Its Lean sources are
# generated by its own build (see README.md) before `lake build` here.
[[require]]
name = "CerberusLean"
git = "https://github.com/mathematics-inc/cerberus-lean-upstream-publish"
rev = "b735d7bdcff9570ed7dce3278d829086b1c008d8"
subDir = "lean_frontend"

# The named C types and the notation the definitions use, and the linked
# program: `LinkedCore.file` (tags, globals, procedure maps).
[[lean_lib]]
name = "Program"
globs = ["Program", "Program.*"]

# One module per C file under linux/drivers/net/wireguard/, one definition
# per C function.
[[lean_lib]]
name = "WireGuard"
globs = ["WireGuard.*"]

# Every other procedure the program uses.
[[lean_lib]]
name = "Support"
globs = ["Support.*"]

# Executes `LinkedCore.file` and prints the evaluator's verdict.
[[lean_exe]]
name = "linked-run"
root = "LinkedRun"
moreLinkArgs = [".lake/packages/CerberusLean/lean_frontend/native/md5.o"]
